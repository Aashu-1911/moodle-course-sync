<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moodle Sync Panel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-area">
        <img src="icon.svg" alt="Hub Logo" class="logo-img">
        <h1>Moodle Course Hub</h1>
      </div>
    </header>

    <!-- Connection Status card -->
    <div id="connection-status-card" class="status-card disconnected">
      <div class="status-dot"></div>
      <div class="status-info">
        <div id="status-title" class="status-title">Disconnected</div>
        <div id="status-desc" class="status-desc">Credentials syncing from dashboard...</div>
      </div>
    </div>

    <!-- Active Configurations Panel -->
    <div class="config-panel">
      <div class="config-row">
        <span class="config-label">Target Semester</span>
        <span id="target-semester-val" class="config-value">-</span>
      </div>
      <div class="config-row">
        <span class="config-label">Last Sync Run</span>
        <span id="last-sync-val" class="config-value">Never</span>
      </div>
    </div>

    <!-- Metrics -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-num" id="metric-detected">0</div>
        <div class="metric-label">Detected</div>
      </div>
      <div class="metric-card">
        <div class="metric-num" id="metric-added">0</div>
        <div class="metric-label">New Added</div>
      </div>
    </div>

    <!-- New course notification block -->
    <div id="new-course-notify" class="notify-card" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
        <span class="notify-title">🎉 New course(s) detected</span>
        <button id="close-notify-btn" style="background:transparent; border:none; color:var(--text-sub); font-size:1rem; cursor:pointer; padding:0 4px; line-height:1;">✕</button>
      </div>
      <div id="new-courses-list" class="notify-list"></div>
      <div id="new-course-assigned" class="notify-assign">Assigned to Target Semester</div>
      <div class="actions-wrapper" style="margin-top: 8px; margin-bottom: 0;">
        <button id="btn-download-new-html" class="btn-primary" style="padding: 6px 12px; font-size: 0.75rem; width: 100%;">Download Updated HTML</button>
      </div>
    </div>

    <!-- HTML Export Console Block -->
    <div id="html-export-section" class="export-panel">
      <h2 style="font-size: 0.85rem; font-weight: 700; color: var(--text-main); margin: 0 0 6px 0; border-bottom: 1px solid var(--bg-border); padding-bottom: 6px; display: flex; align-items: center; gap: 6px;">📄 Moodle HTML Export</h2>
      <div id="html-status-desc" style="font-size: 0.75rem; color: var(--text-sub); margin-bottom: 10px;">✓ HTML ready</div>
      <div class="actions-wrapper" style="gap: 8px; margin-top: 0;">
        <button id="btn-copy-html" class="btn-secondary" style="flex: 1; padding: 8px 10px; font-size: 0.78rem;">Copy HTML</button>
        <button id="btn-download-html" class="btn-primary" style="flex: 1; padding: 8px 10px; font-size: 0.78rem;">Download HTML</button>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions-wrapper">
      <button id="btn-sync" class="btn-primary" disabled>Sync Now</button>
      <button id="btn-dashboard" class="btn-secondary">Open Dashboard</button>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script src="htmlGenerator.js"></script>
  <script src="popup.js"></script>
</body>
</html>
